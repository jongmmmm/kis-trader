{% extends "base.html" %}
{% block title %}전략 관리 — KIS 자동매매{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">전략 관리</h4>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
    <i class="fa-solid fa-plus me-1"></i>전략 추가
  </button>
</div>
<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>이름</th><th>종목</th><th>전략유형</th><th>모드</th><th>상태</th><th>관리</th></tr>
      </thead>
      <tbody id="strategy-body">
        <tr><td colspan="6" class="text-center text-muted py-4">로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 차트 영역 -->
<div id="chart-section" class="mt-4" style="display:none;">
  <div class="card shadow-sm">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">
          <i class="fa-solid fa-chart-line me-2"></i>
          <span id="chart-title">차트</span>
        </h5>
        <div class="d-flex align-items-center gap-2">
          <span id="chart-loading" class="text-muted small" style="display:none;">
            <i class="fa-solid fa-spinner fa-spin me-1"></i>로딩 중...
          </span>
          <button class="btn btn-sm btn-outline-secondary" onclick="refreshChart()">
            <i class="fa-solid fa-rotate-right me-1"></i>새로고침
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="closeChart()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div class="btn-group" id="period-buttons" role="group">
        <button type="button" class="btn btn-sm btn-outline-primary" data-period="day">1일</button>
        <button type="button" class="btn btn-sm btn-outline-primary active" data-period="month">1개월</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-period="year">1년</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-period="5year">5년</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-period="10year">10년</button>
      </div>
      <span id="period-label" class="ms-2 text-muted small">일봉</span>
    </div>
    <div class="card-body p-2">
      <!-- 캔들스틱 + MA 차트 -->
      <div id="candle-chart" style="height:400px;"></div>
      <!-- 거래량 차트 -->
      <div id="volume-chart" style="height:120px;"></div>
      <!-- 보조지표 영역 -->
      <div class="row mt-2">
        <div class="col-md-6">
          <div class="card border">
            <div class="card-header py-1 px-2"><small class="fw-bold">RSI</small></div>
            <div id="rsi-chart" style="height:150px;"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card border">
            <div class="card-header py-1 px-2"><small class="fw-bold">MACD</small></div>
            <div id="macd-chart" style="height:150px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">전략 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">전략명</label>
          <input type="text" class="form-control" id="s-name" placeholder="삼성전자 MA전략">
        </div>
        <div class="mb-3">
          <label class="form-label">종목코드</label>
          <input type="text" class="form-control" id="s-code" placeholder="005930">
        </div>
        <div class="mb-3">
          <label class="form-label">종목명</label>
          <input type="text" class="form-control" id="s-sname" placeholder="삼성전자">
        </div>
        <div class="mb-3">
          <label class="form-label">전략 유형</label>
          <select class="form-select" id="s-type" onchange="updateParamHint()">
            <option value="ma">이동평균선 (MA/EMA)</option>
            <option value="rsi_macd">RSI / MACD</option>
            <option value="condition">조건식 직접 설정</option>
            <option value="ml">AI/ML 예측 (RandomForest)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">파라미터 (JSON)</label>
          <textarea class="form-control font-monospace" id="s-params" rows="5"></textarea>
          <div class="text-muted small mt-1" id="param-hint"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">모드</label>
          <select class="form-select" id="s-mode">
            <option value="paper">모의투자</option>
            <option value="real">실전투자</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="addStrategy()">추가</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
const PARAM_DEFAULTS = {
  ma: '{"short_period":5,"long_period":20,"buy_qty":10,"stop_loss_pct":-3,"take_profit_pct":5}',
  rsi_macd: '{"rsi_period":14,"rsi_oversold":30,"rsi_overbought":70,"macd_fast":12,"macd_slow":26,"macd_signal":9,"buy_qty":10}',
  condition: '{"conditions":[{"indicator":"change_rate","operator":">","value":3}],"action":"buy","buy_qty":5}',
  ml: '{"buy_threshold":0.65,"sell_threshold":0.35,"buy_qty":10}',
};
function updateParamHint() {
  const t = document.getElementById("s-type").value;
  document.getElementById("s-params").value = PARAM_DEFAULTS[t] || "{}";
  document.getElementById("param-hint").textContent = "기본 파라미터 예시가 자동 입력됐습니다.";
}
updateParamHint();

/* ---------- 기간 선택 ---------- */
let currentPeriod = "month";
let currentChartStrategyId = null;
let currentChartStockName = null;

const periodLabels = {
  day: "일봉 (최근 30일)",
  month: "일봉 (최근 3개월)",
  year: "일봉 (최근 1년)",
  "5year": "주봉 (최근 5년)",
  "10year": "월봉 (최근 10년)",
};

document.getElementById("period-buttons").addEventListener("click", e => {
  const btn = e.target.closest("[data-period]");
  if (!btn || !currentChartStrategyId) return;
  document.querySelectorAll("#period-buttons .btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentPeriod = btn.dataset.period;
  document.getElementById("period-label").textContent = periodLabels[currentPeriod] || "";
  openChart(currentChartStrategyId, currentChartStockName);
});

function loadStrategies() {
  fetch("/strategies/api/strategies").then(r => r.json()).then(list => {
    const tbody = document.getElementById("strategy-body");
    tbody.textContent = "";
    if (!list.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 6; td.className = "text-center text-muted py-4";
      td.textContent = "등록된 전략이 없습니다";
      tr.appendChild(td); tbody.appendChild(tr); return;
    }
    const typeLabel = {ma:"MA/EMA", rsi_macd:"RSI/MACD", condition:"조건식", ml:"AI/ML"};
    list.forEach(s => {
      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.addEventListener("click", (e) => {
        if (e.target.closest("button") || e.target.closest(".badge")) return;
        openChart(s.id, s.stock_name || s.stock_code);
      });
      if (currentChartStrategyId === s.id) {
        tr.classList.add("table-active");
      }
      [s.name, s.stock_code + " " + s.stock_name,
       typeLabel[s.strategy_type] || s.strategy_type,
       s.mode === "real" ? "실전" : "모의"].forEach(text => {
        const td = document.createElement("td");
        td.textContent = text; tr.appendChild(td);
      });
      const tdS = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + (s.is_active ? "bg-success" : "bg-secondary");
      badge.textContent = s.is_active ? "활성" : "비활성";
      badge.style.cursor = "pointer";
      badge.addEventListener("click", () => {
        fetch("/strategies/api/strategies/" + s.id + "/toggle", {method:"POST"}).then(() => loadStrategies());
      });
      tdS.appendChild(badge); tr.appendChild(tdS);
      const tdB = document.createElement("td");
      tdB.className = "d-flex gap-1";
      const aiBtn = document.createElement("button");
      aiBtn.className = "btn btn-sm btn-outline-info";
      aiBtn.innerHTML = '<i class="fa-solid fa-brain"></i>';
      aiBtn.title = "AI 분석";
      aiBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        runAiAnalysis(s.id);
      });
      tdB.appendChild(aiBtn);
      const btn = document.createElement("button");
      btn.className = "btn btn-sm btn-outline-danger";
      btn.textContent = "삭제";
      btn.addEventListener("click", () => {
        if (!confirm("삭제하시겠습니까?")) return;
        fetch("/strategies/api/strategies/" + s.id, {method:"DELETE"}).then(() => loadStrategies());
      });
      tdB.appendChild(btn); tr.appendChild(tdB);
      tbody.appendChild(tr);
    });
  });
}

function addStrategy() {
  let params;
  try { params = JSON.parse(document.getElementById("s-params").value); }
  catch(e) { alert("파라미터 JSON 형식 오류"); return; }
  fetch("/strategies/api/strategies", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: document.getElementById("s-name").value,
      stock_code: document.getElementById("s-code").value,
      stock_name: document.getElementById("s-sname").value,
      strategy_type: document.getElementById("s-type").value,
      params, mode: document.getElementById("s-mode").value,
    }),
  }).then(r => r.json()).then(() => {
    bootstrap.Modal.getInstance(document.getElementById("addModal")).hide();
    loadStrategies();
  });
}

/* ---------- 차트 ---------- */
let candleChart = null, volumeChart = null, rsiChart = null, macdChart = null;
let chartRefreshTimer = null;

function destroyCharts() {
  [candleChart, volumeChart, rsiChart, macdChart].forEach(c => { if (c) c.remove(); });
  candleChart = volumeChart = rsiChart = macdChart = null;
}

function closeChart() {
  document.getElementById("chart-section").style.display = "none";
  currentChartStrategyId = null;
  destroyCharts();
  if (chartRefreshTimer) { clearInterval(chartRefreshTimer); chartRefreshTimer = null; }
  loadStrategies();
}

function refreshChart() {
  if (currentChartStrategyId) openChart(currentChartStrategyId);
}

function openChart(strategyId, stockName) {
  currentChartStrategyId = strategyId;
  if (stockName) currentChartStockName = stockName;
  const section = document.getElementById("chart-section");
  section.style.display = "block";
  document.getElementById("chart-loading").style.display = "inline";
  document.getElementById("period-label").textContent = periodLabels[currentPeriod] || "";
  if (currentChartStockName) {
    document.getElementById("chart-title").textContent = currentChartStockName + " 차트";
  }
  loadStrategies();

  const url = "/strategies/api/strategies/" + strategyId + "/chart?period=" + currentPeriod;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      document.getElementById("chart-loading").style.display = "none";
      if (data.error) { alert(data.error); return; }
      renderCharts(data);

      if (chartRefreshTimer) clearInterval(chartRefreshTimer);
      chartRefreshTimer = setInterval(() => {
        fetch(url)
          .then(r => r.json())
          .then(d => { if (!d.error) renderCharts(d); })
          .catch(() => {});
      }, 60000);
    })
    .catch(err => {
      document.getElementById("chart-loading").style.display = "none";
      alert("차트 데이터 로딩 실패: " + err.message);
    });

  section.scrollIntoView({ behavior: "smooth", block: "start" });
}

const chartColors = {
  bg: "#ffffff",
  text: "#333333",
  grid: "#f0f0f0",
  maShort: "#e74c3c",
  maLong: "#3498db",
  ma60: "#9b59b6",
  volUp: "rgba(231,76,60,0.5)",
  volDown: "rgba(52,152,219,0.5)",
  rsi: "#8e44ad",
  rsiOver: "rgba(231,76,60,0.15)",
  rsiUnder: "rgba(52,152,219,0.15)",
  macd: "#2980b9",
  macdSignal: "#e67e22",
  macdHistUp: "rgba(231,76,60,0.6)",
  macdHistDown: "rgba(52,152,219,0.6)",
};

function createChart(containerId, height) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  return LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: height || container.clientHeight || 300,
    layout: { background: { type: "solid", color: chartColors.bg }, textColor: chartColors.text, fontSize: 11 },
    grid: { vertLines: { color: chartColors.grid }, horzLines: { color: chartColors.grid } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: "#ddd" },
    timeScale: { borderColor: "#ddd", timeVisible: false },
    localization: { priceFormatter: p => p.toLocaleString("ko-KR") },
  });
}

function renderCharts(data) {
  destroyCharts();
  const candles = data.candles;
  if (!candles || !candles.length) return;

  /* --- 1. 캔들스틱 + 이동평균 --- */
  candleChart = createChart("candle-chart", 400);
  const candleSeries = candleChart.addCandlestickSeries({
    upColor: "#e74c3c", downColor: "#3498db",
    borderUpColor: "#e74c3c", borderDownColor: "#3498db",
    wickUpColor: "#e74c3c", wickDownColor: "#3498db",
  });
  candleSeries.setData(candles.map(c => ({
    time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
  })));

  const maShortSeries = candleChart.addLineSeries({ color: chartColors.maShort, lineWidth: 1, title: "MA" + (data.params.short_period || 5) });
  maShortSeries.setData(candles.filter(c => c.ma_short > 0).map(c => ({ time: c.time, value: c.ma_short })));

  const maLongSeries = candleChart.addLineSeries({ color: chartColors.maLong, lineWidth: 1, title: "MA" + (data.params.long_period || 20) });
  maLongSeries.setData(candles.filter(c => c.ma_long > 0).map(c => ({ time: c.time, value: c.ma_long })));

  const ma60Series = candleChart.addLineSeries({ color: chartColors.ma60, lineWidth: 1, title: "MA60" });
  ma60Series.setData(candles.filter(c => c.ma60 > 0).map(c => ({ time: c.time, value: c.ma60 })));

  candleChart.timeScale().fitContent();

  /* --- 2. 거래량 --- */
  volumeChart = createChart("volume-chart", 120);
  const volSeries = volumeChart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "vol",
  });
  volSeries.setData(candles.map(c => ({
    time: c.time,
    value: c.volume,
    color: c.close >= c.open ? chartColors.volUp : chartColors.volDown,
  })));
  const volMaSeries = volumeChart.addLineSeries({ color: "#f39c12", lineWidth: 1, title: "Vol MA20", priceScaleId: "vol" });
  volMaSeries.setData(candles.filter(c => c.vol_ma20 > 0).map(c => ({ time: c.time, value: c.vol_ma20 })));
  volumeChart.timeScale().fitContent();

  /* --- 3. RSI --- */
  rsiChart = createChart("rsi-chart", 150);
  const rsiSeries = rsiChart.addLineSeries({ color: chartColors.rsi, lineWidth: 2, title: "RSI" });
  rsiSeries.setData(candles.filter(c => c.rsi > 0).map(c => ({ time: c.time, value: c.rsi })));

  const rsiOver = data.params.rsi_overbought || 70;
  const rsiUnder = data.params.rsi_oversold || 30;
  const rsiOverLine = rsiChart.addLineSeries({ color: "#e74c3c", lineWidth: 1, lineStyle: 2, title: "과매수 " + rsiOver });
  rsiOverLine.setData(candles.map(c => ({ time: c.time, value: rsiOver })));
  const rsiUnderLine = rsiChart.addLineSeries({ color: "#3498db", lineWidth: 1, lineStyle: 2, title: "과매도 " + rsiUnder });
  rsiUnderLine.setData(candles.map(c => ({ time: c.time, value: rsiUnder })));
  rsiChart.timeScale().fitContent();

  /* --- 4. MACD --- */
  macdChart = createChart("macd-chart", 150);
  const macdLine = macdChart.addLineSeries({ color: chartColors.macd, lineWidth: 2, title: "MACD" });
  macdLine.setData(candles.map(c => ({ time: c.time, value: c.macd })));
  const signalLine = macdChart.addLineSeries({ color: chartColors.macdSignal, lineWidth: 1, title: "Signal" });
  signalLine.setData(candles.map(c => ({ time: c.time, value: c.macd_signal })));
  const histSeries = macdChart.addHistogramSeries({ title: "Histogram" });
  histSeries.setData(candles.map(c => ({
    time: c.time, value: c.macd_hist,
    color: c.macd_hist >= 0 ? chartColors.macdHistUp : chartColors.macdHistDown,
  })));
  macdChart.timeScale().fitContent();

  /* --- 차트 시간축 동기화 --- */
  const charts = [candleChart, volumeChart, rsiChart, macdChart];
  let syncing = false;
  charts.forEach(chart => {
    chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing) return;
      syncing = true;
      charts.forEach(other => {
        if (other !== chart) other.timeScale().setVisibleLogicalRange(range);
      });
      syncing = false;
    });
  });

  /* --- 반응형 리사이즈 --- */
  const ro = new ResizeObserver(() => {
    [["candle-chart", candleChart], ["volume-chart", volumeChart],
     ["rsi-chart", rsiChart], ["macd-chart", macdChart]].forEach(([id, c]) => {
      if (c) {
        const el = document.getElementById(id);
        c.applyOptions({ width: el.clientWidth });
      }
    });
  });
  ro.observe(document.getElementById("candle-chart"));
}

/* ---------- AI 분석 (수동 실행) ---------- */
function runAiAnalysis(strategyId) {
  if (!confirm("AI 분석을 실행하시겠습니까? (몇 초 소요)")) return;
  fetch("/strategies/api/strategies/" + strategyId + "/ai-analyze")
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert("분석 실패: " + data.error); return; }
      // auction popup 형식으로 표시
      showAuctionPopup({
        id: null,
        stock_code: data.stock_code,
        stock_name: data.stock_name,
        suggested_action: data.action,
        suggested_price: data.price,
        suggested_qty: 0,
        ai_confidence: data.confidence,
        ai_score: data.total_score,
        ai_summary: data.summary,
        ai_factors: data.factors,
        expires_at: new Date(Date.now() + 600000).toISOString(),
      });
    })
    .catch(err => alert("분석 오류: " + err.message));
}

loadStrategies();
</script>
{% endblock %}
