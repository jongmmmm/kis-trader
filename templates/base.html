<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KIS 자동매매{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { color: #fff !important; font-weight: bold; }
    .navbar { background: #1a1a2e !important; }
    .sidebar { min-height: calc(100vh - 52px); background: #16213e; padding-top: 16px; width: 200px; flex-shrink: 0; }
    .sidebar a { color: #ccc; display: block; padding: 10px 20px; text-decoration: none; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: #6c63ff; color: #fff; }
    .mode-badge { font-size: .75rem; padding: 3px 8px; border-radius: 10px; }
    .mode-paper { background: #fff3cd; color: #856404; }
    .mode-real  { background: #f8d7da; color: #721c24; }
    #auction-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9999; align-items: center; justify-content: center; }
    #auction-overlay.show { display: flex; }
    .auction-card { background: #fff; border-radius: 14px; padding: 32px; min-width: 360px; box-shadow: 0 8px 40px rgba(0,0,0,.35); }
    .user-info { color: #ccc; font-size: .85rem; }
    .user-info a { color: #ccc; text-decoration: none; margin-left: 10px; }
    .user-info a:hover { color: #fff; }
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar a span { display: none; }
      .sidebar a { text-align: center; padding: 10px 5px; }
      .sidebar a i { margin: 0 !important; font-size: 1.2rem; }
      .auction-card { min-width: auto !important; max-width: 95vw !important; padding: 20px; }
      main { padding: 12px !important; }
    }
  </style>
</head>
<body>
<nav class="navbar px-3 py-2 d-flex justify-content-between">
  <span class="navbar-brand">KIS 자동매매</span>
  <div class="d-flex align-items-center gap-3">
    <span id="mode-badge" class="mode-badge mode-paper">모의투자</span>
    {% if current_user.is_authenticated %}
    <div class="user-info">
      <i class="fa-solid fa-user"></i> {{ current_user.name or current_user.username }}
      <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</a>
    </div>
    {% else %}
    <a href="/login" class="btn btn-sm btn-outline-light">
      <i class="fa-solid fa-right-to-bracket me-1"></i>로그인
    </a>
    {% endif %}
  </div>
</nav>
<div class="d-flex">
  <nav class="sidebar">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">
      <i class="fa-solid fa-chart-line me-2"></i><span>대시보드</span>
    </a>
    <a href="/strategies/" class="{% if '/strategies' in request.path %}active{% endif %}">
      <i class="fa-solid fa-robot me-2"></i><span>전략 관리</span>
    </a>
    <a href="/orders/" class="{% if '/orders' in request.path %}active{% endif %}">
      <i class="fa-solid fa-list me-2"></i><span>주문 내역</span>
    </a>
    <a href="/settings/" class="{% if '/settings' in request.path %}active{% endif %}">
      <i class="fa-solid fa-gear me-2"></i><span>설정</span>
    </a>
  </nav>
  <main class="flex-grow-1 p-4">{% block content %}{% endblock %}</main>
</div>

<!-- 동시호가 AI 분석 팝업 -->
<div id="auction-overlay">
  <div class="auction-card" style="min-width:520px; max-width:640px;">
    <h5 class="fw-bold mb-3"><i class="fa-solid fa-brain text-warning me-2"></i>AI 동시호가 분석</h5>

    <!-- 종목 정보 -->
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2" style="border-bottom:1px solid #eee;">
      <div>
        <span class="fw-bold fs-5" id="au-name"></span>
        <span class="text-muted ms-1" id="au-code"></span>
      </div>
      <div class="text-end">
        <span class="fw-bold fs-5" id="au-price"></span><span class="text-muted">원</span>
        <span class="ms-1 small" id="au-qty-info"></span>
      </div>
    </div>

    <!-- 게이지 + 추천 -->
    <div class="d-flex align-items-center gap-4 mb-3 p-3 rounded" id="au-verdict-box" style="background:#f8f9fa;">
      <!-- 원형 게이지 -->
      <div style="position:relative;width:110px;height:110px;flex-shrink:0;">
        <svg viewBox="0 0 120 120" width="110" height="110">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#e9ecef" stroke-width="10"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round"
            id="au-gauge-circle"
            stroke-dasharray="327" stroke-dashoffset="327"
            transform="rotate(-90 60 60)"
            style="transition: stroke-dashoffset 1s ease, stroke 0.5s;"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <span id="au-score" style="font-size:22px;font-weight:800;line-height:1;">0</span>
          <span style="font-size:10px;color:#999;">종합점수</span>
        </div>
      </div>
      <div class="flex-grow-1">
        <div class="mb-2">
          <span id="au-action" class="badge fs-6 px-3 py-2"></span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:12px;font-weight:600;width:40px;">신뢰도</span>
          <div style="flex:1;height:10px;background:#e9ecef;border-radius:5px;overflow:hidden;">
            <div id="au-confidence-bar" style="height:100%;width:0%;border-radius:5px;transition:width 1s ease;"></div>
          </div>
          <span style="font-size:12px;font-weight:700;width:35px;text-align:right;" id="au-confidence-val">0%</span>
        </div>
        <div style="font-size:11px;color:#888;margin-top:4px;" id="au-verdict-text"></div>
      </div>
    </div>

    <!-- 팩터 수평 바 차트 -->
    <div class="mb-3" id="au-factors" style="display:flex;flex-direction:column;gap:6px;"></div>

    <!-- AI 요약 -->
    <div class="p-3 rounded mb-3" style="background:#f0f4ff; font-size:.82rem; white-space:pre-line; line-height:1.6;" id="au-summary"></div>

    <!-- 만료 시간 -->
    <p class="text-muted small mb-3 text-center">만료: <span id="au-expires"></span></p>

    <!-- 사용자 결정 버튼 -->
    <div class="d-flex gap-2">
      <button class="btn btn-danger flex-fill py-2" onclick="auctionDecide('sell')">
        <i class="fa-solid fa-arrow-down me-1"></i>매도 (돈 빼기)
      </button>
      <button class="btn btn-primary flex-fill py-2" onclick="auctionDecide('buy')">
        <i class="fa-solid fa-arrow-up me-1"></i>매수 (돈 넣기)
      </button>
      <button class="btn btn-secondary flex-fill py-2" onclick="document.getElementById('auction-overlay').classList.remove('show'); auctionDecide('pass');">
        <i class="fa-solid fa-hand me-1"></i>패스
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auction.js?v=2"></script>
<script>
  fetch("/api/settings/mode").then(r => r.json()).then(d => {
    const b = document.getElementById("mode-badge");
    if (d.mode === "real") { b.textContent = "실전투자"; b.className = "mode-badge mode-real"; }
    else { b.textContent = "모의투자"; b.className = "mode-badge mode-paper"; }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
