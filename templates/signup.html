<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — KIS 자동매매</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #e0f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .signup-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 520px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .signup-card h3 { font-weight: 900; }
    .form-label { font-weight: 700; font-size: .9rem; }
    .hint { font-size: .78rem; margin-left: 8px; }
    .hint-ok { color: #28a745; }
    .hint-err { color: #dc3545; }
    .btn-signup { background: #00bcd4; border: none; color: #fff; font-weight: 700; padding: 10px 30px; border-radius: 8px; }
    .btn-signup:hover { background: #00acc1; color: #fff; }
    .btn-cancel { background: #ffc107; border: none; color: #fff; font-weight: 700; padding: 10px 30px; border-radius: 8px; }
    .btn-cancel:hover { background: #ffb300; color: #fff; }
    .btn-check-dup { background: #00bcd4; border: none; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 16px; }
    .btn-check-dup:hover { background: #00acc1; color: #fff; }
  </style>
</head>
<body>
<div class="signup-card">
  <h3 class="text-center mb-1">회원가입</h3>
  <p class="text-muted text-center mb-4">회원이 되어 다양한 혜택을 경험해 보세요!</p>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="alert alert-danger py-2 small">
    {% for msg in messages %}<div>{{ msg }}</div>{% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <form method="POST" id="signup-form">
    <!-- 아이디 -->
    <div class="mb-3">
      <label class="form-label">아이디 <span class="hint" id="id-hint"></span></label>
      <div class="d-flex gap-2">
        <input type="text" class="form-control" name="username" id="username"
               placeholder="아이디 입력 (6~20자)" minlength="6" maxlength="20" required>
        <button type="button" class="btn btn-check-dup" onclick="checkDup()">중복 확인</button>
      </div>
    </div>

    <!-- 비밀번호 -->
    <div class="mb-3">
      <label class="form-label">비밀번호 <span class="hint" id="pw-hint"></span></label>
      <input type="password" class="form-control" name="password" id="password"
             placeholder="비밀번호 입력 (문자, 숫자, 특수문자 포함 8~20자)" minlength="8" maxlength="20" required autocomplete="new-password">
    </div>

    <!-- 비밀번호 확인 -->
    <div class="mb-3">
      <label class="form-label">비밀번호 확인 <span class="hint" id="pw2-hint"></span></label>
      <input type="password" class="form-control" name="password2" id="password2"
             placeholder="비밀번호 재입력" required autocomplete="new-password">
    </div>

    <!-- 이름 -->
    <div class="mb-3">
      <label class="form-label">이름</label>
      <input type="text" class="form-control" name="name" placeholder="이름을 입력해주세요" required>
    </div>

    <!-- 전화번호 -->
    <div class="mb-3">
      <label class="form-label">전화번호</label>
      <input type="tel" class="form-control" name="phone" placeholder="휴대폰 번호 입력 (* 제외 11자리)" maxlength="11" pattern="[0-9]{11}">
    </div>

    <!-- 이메일 -->
    <div class="mb-3">
      <label class="form-label">이메일 주소</label>
      <div class="d-flex align-items-center gap-2">
        <input type="text" class="form-control" name="email_local" placeholder="이메일 주소">
        <span>@</span>
        <select class="form-select" name="email_domain" id="email-domain">
          <option value="naver.com">naver.com</option>
          <option value="gmail.com">gmail.com</option>
          <option value="daum.net">daum.net</option>
          <option value="hanmail.net">hanmail.net</option>
          <option value="kakao.com">kakao.com</option>
          <option value="nate.com">nate.com</option>
          <option value="">직접입력</option>
        </select>
      </div>
    </div>

    <!-- 로그인 방식 -->
    <div class="mb-3">
      <label class="form-label">로그인 방식</label>
      <div class="d-flex gap-3">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="login_method" id="method-password" value="password" checked>
          <label class="form-check-label" for="method-password">
            <i class="fa-solid fa-keyboard me-1"></i>비밀번호 입력
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="login_method" id="method-webauthn" value="webauthn">
          <label class="form-check-label" for="method-webauthn">
            <i class="fa-solid fa-fingerprint me-1"></i>지문인식
          </label>
        </div>
      </div>
      <div id="webauthn-notice" class="small text-muted mt-1" style="display:none;">
        회원가입 후 지문 등록 화면으로 이동합니다.
      </div>
    </div>

    <!-- 생년월일 -->
    <div class="mb-4">
      <label class="form-label">생년월일</label>
      <div class="d-flex gap-2">
        <select class="form-select" name="birth_year" id="birth-year">
          <option value="">년도</option>
        </select>
        <select class="form-select" name="birth_month" id="birth-month">
          <option value="">월</option>
        </select>
        <select class="form-select" name="birth_day" id="birth-day">
          <option value="">일</option>
        </select>
      </div>
    </div>

    <!-- 버튼 -->
    <div class="d-flex justify-content-center gap-3">
      <button type="submit" class="btn btn-signup">가입하기</button>
      <a href="/login" class="btn btn-cancel">가입취소</a>
    </div>
  </form>
</div>

<script>
// 생년월일 옵션 생성
(function() {
  var ysel = document.getElementById("birth-year");
  for (var y = 2010; y >= 1950; y--) {
    var o = document.createElement("option"); o.value = y; o.textContent = y;
    ysel.appendChild(o);
  }
  var msel = document.getElementById("birth-month");
  for (var m = 1; m <= 12; m++) {
    var o = document.createElement("option"); o.value = m; o.textContent = m;
    msel.appendChild(o);
  }
  var dsel = document.getElementById("birth-day");
  for (var d = 1; d <= 31; d++) {
    var o = document.createElement("option"); o.value = d; o.textContent = d;
    dsel.appendChild(o);
  }
})();

// 아이디 중복 확인
function checkDup() {
  var u = document.getElementById("username").value.trim();
  var hint = document.getElementById("id-hint");
  if (u.length < 6) { hint.textContent = "6자 이상 입력해주세요."; hint.className = "hint hint-err"; return; }
  hint.textContent = "확인 중..."; hint.className = "hint";
  fetch("/api/auth/check-username?username=" + encodeURIComponent(u))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      hint.textContent = d.msg;
      hint.className = d.available ? "hint hint-ok" : "hint hint-err";
    })
    .catch(function(e) {
      hint.textContent = "서버 오류가 발생했습니다."; hint.className = "hint hint-err";
    });
}

// 비밀번호 유효성 실시간 검사
document.getElementById("password").addEventListener("input", function() {
  var pw = this.value;
  var hint = document.getElementById("pw-hint");
  if (pw.length < 8) { hint.textContent = "8자 이상 입력해주세요."; hint.className = "hint hint-err"; }
  else if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw) || !/[!@#$%^&*(),.?":{}|<>]/.test(pw)) {
    hint.textContent = "문자, 숫자, 특수문자를 포함해야 합니다."; hint.className = "hint hint-err";
  } else { hint.textContent = "사용 가능한 비밀번호입니다."; hint.className = "hint hint-ok"; }
});

// 비밀번호 확인 실시간 검사
document.getElementById("password2").addEventListener("input", function() {
  var hint = document.getElementById("pw2-hint");
  if (this.value !== document.getElementById("password").value) {
    hint.textContent = "비밀번호가 일치하지 않습니다."; hint.className = "hint hint-err";
  } else { hint.textContent = "비밀번호가 일치합니다."; hint.className = "hint hint-ok"; }
});

// 로그인 방식 토글
document.querySelectorAll('input[name="login_method"]').forEach(function(r) {
  r.addEventListener("change", async function() {
    var notice = document.getElementById("webauthn-notice");
    if (this.value === "webauthn") {
      notice.style.display = "block";
      if (!window.PublicKeyCredential) {
        notice.innerHTML = '<span class="text-warning">현재 브라우저에서는 지문 등록이 안 될 수 있습니다.<br>회원가입 후 <b>Chrome 브라우저</b>에서 지문을 등록해주세요.</span>';
        return;
      }
      try {
        var available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (!available) {
          notice.innerHTML = '<span class="text-warning">이 기기에 지문/생체인식 센서가 감지되지 않았습니다.<br>Windows Hello, PIN 등으로 대체 인증이 가능합니다.</span>';
        } else {
          notice.innerHTML = '회원가입 후 지문 등록 화면으로 이동합니다.';
        }
      } catch(e) {
        notice.innerHTML = '회원가입 후 지문 등록 화면으로 이동합니다.';
      }
    } else {
      notice.style.display = "none";
    }
  });
});

// 이메일 직접입력
document.getElementById("email-domain").addEventListener("change", function() {
  if (this.value === "") {
    var custom = prompt("이메일 도메인을 입력하세요 (예: company.com)");
    if (custom) {
      var opt = document.createElement("option"); opt.value = custom; opt.textContent = custom;
      this.insertBefore(opt, this.lastElementChild);
      this.value = custom;
    }
  }
});
</script>
</body>
</html>
